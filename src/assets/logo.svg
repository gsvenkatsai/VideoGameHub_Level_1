<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0B0F1A" />
      <stop offset="100%" stop-color="#05070E" />
    </linearGradient>

    <!-- Cyan to Violet Cyber Gradient -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Vibrant Cyan -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Vibrant Violet -->
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Shield / Hexagon Frame -->
  <polygon
    points="256,24 456,120 456,360 256,488 56,360 56,120"
    fill="url(#bgGrad)"
    stroke="url(#cyberGrad)"
    stroke-width="12"
    stroke-linejoin="round"
  />

  <!-- Subtle Inner Inset Bevel -->
  <polygon
    points="256,48 432,132 432,348 256,460 80,348 80,132"
    fill="none"
    stroke="white"
    stroke-opacity="0.08"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Background Cyber Circuit Accents -->
  <path
    d="M 120 180 L 180 180 L 220 220"
    stroke="#22D3EE"
    stroke-opacity="0.25"
    stroke-width="4"
    stroke-linecap="round"
  />
  <circle cx="120" cy="180" r="5" fill="#22D3EE" fill-opacity="0.4" />

  <path
    d="M 392 180 L 332 180 L 292 220"
    stroke="#C084FC"
    stroke-opacity="0.25"
    stroke-width="4"
    stroke-linecap="round"
  />
  <circle cx="392" cy="180" r="5" fill="#C084FC" fill-opacity="0.4" />

  <!-- Iconic Stylized "C" Clutch Geometric Mark (Left Wing / Claw) -->
  <path
    d="M 240 110 L 340 168 L 292 196 L 224 156 L 160 196 L 160 316 L 224 356 L 292 316 L 340 344 L 240 402 L 112 328 L 112 184 Z"
    fill="url(#cyanGrad)"
    filter="url(#subtleGlow)"
  />

  <!-- Forward Clutch Chevron Arrow (Right Thrust / Apex) -->
  <path
    d="M 276 216 L 346 256 L 276 296 L 316 320 L 406 256 L 316 192 Z"
    fill="url(#violetGrad)"
    filter="url(#subtleGlow)"
  />

  <!-- Central Core Gaming Diamond Pip -->
  <polygon
    points="256,228 284,256 256,284 228,256"
    fill="#FFFFFF"
    filter="url(#glow)"
  />

  <!-- Subtle Top Specular Sheen -->
  <path
    d="M 256 28 L 450 122 L 390 156 L 256 90 L 122 156 L 62 122 Z"
    fill="white"
    fill-opacity="0.08"
  />
</svg>
